# A Werkstatt app (laib-app new; guide: /opt/werkstatt/guide/apps.md).
name: gesundheit
title: Gesundheit
beschreibung: Arztunterlagen als Verlauf, Tagesnotiz
template: {registry: apps, name: gesundheit, version: 1}
provides: [gesundheit]
# Gesundheit (laib#893, mdopp/gesundheit): medical records from Paperless
# (lab sheets, reports, breath tests) read by the household model into a
# timeline per person, with a short daily note. A Paperless client with its
# own user (no administrator), reached by Paperless' workflow „Dokument
# hinzugefügt“ at its hook and by the Bote over MCP, both on the host side
# for the pods (host.containers.internal), never through Caddy. The pages
# are behind Authelia: a person sees their own timeline, an admin also the
# children's (KINDER); Paperless' administrators still see every document.
after: [auth, paperless]       # the model is waited for, not ordered (a model role may live on another box)
routes:
  # gesundheit.<domain>: one Strato CNAME (ADR 0007), the owner creates it.
  # internal = the home network only; public is the owner's decision.
  # Authelia does the login (the app has none) for the LLDAP group; Caddy
  # then sends X-Gesundheit-Proxy, so the app may trust Remote-User.
  - host: gesundheit
    port: 18528
    exposure: internal
    auth: one_factor
    group: family
    proxySecret: GESUNDHEIT_PROXY_SECRET
secrets:
  # generated on the box on first apply, never in the repo
  - name: GESUNDHEIT_PROXY_SECRET
  - name: GESUNDHEIT_BOTE_TOKEN      # generated: the Bote's bearer for the MCP on 18529/mcp (the bote template takes it as an optional source, laib#894)
  - name: GESUNDHEIT_WEBHOOK_TOKEN   # generated: Paperless' workflow sends it as X-Gesundheit-Token; paperless' post-deploy reads it to make the webhook action (laib#894)
  - name: PAPERLESS_GESUNDHEIT_TOKEN # minted by paperless' post-deploy (laib#894): the API token of Paperless' user gesundheit, no administrator; without it nothing is read and the status says so
    external: true
    optional: true
data:
  - path: ${DATA_DIR}/gesundheit   # one folder per person (values, days, questions), the record of the documents read, the status file; plain JSON, backed up
health:
  http: http://127.0.0.1:18528/healthz
status:                            # what the last run did and what waits for a person; further fields reach laib_status as eigenes (lauf)
  file: ${DATA_DIR}/gesundheit/laib-status.json
ports:
  # 18528: only Caddy reaches it, never the WLAN
  - {port: 18528, lan: false}
  # 18529: the hook and the MCP, on the host for the pods, as Dokumente's 8720; nftables drops it on the LAN, no route
  - {port: 18529, lan: false}
